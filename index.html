<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบประเมินความพึงพอใจ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="hero-banner">
        <div class="container">
            <h1>ระบบประเมินความพึงพอใจ</h1>
            <p>เก็บรวบรวมความคิดเห็น เพื่อนำไปพัฒนาการให้บริการที่ดียิ่งขึ้น</p>
        </div>
    </header>

    <main class="container">
        <div id="loading" class="spinner hidden"></div>
        <div id="surveyGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
            <!-- Surveys will be loaded here via JS -->
        </div>
        <div id="emptyState" class="hidden text-center mt-4">
            <i class="fas fa-clipboard-list fa-3x" style="color: var(--text-secondary); margin-bottom: 1rem;"></i>
            <h3>ยังไม่มีแบบประเมินในขณะนี้</h3>
            <p style="color: var(--text-secondary);">โปรดกลับมาตรวจสอบอีกครั้งในภายหลัง</p>
        </div>
    </main>

    <footer class="container text-center mt-4 mb-4" style="color: var(--text-secondary); font-size: 0.875rem;">
        <p>&copy; 2026 ระบบประเมินความพึงพอใจ</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loading = document.getElementById('loading');
            const surveyGrid = document.getElementById('surveyGrid');
            const emptyState = document.getElementById('emptyState');

            const fetchSurveys = async () => {
                loading.classList.remove('hidden');
                try {
                    const res = await fetch('api/surveys.php?public=1');
                    const json = await res.json();
                    
                    loading.classList.add('hidden');

                    const surveys = json.data || [];
                    
                    if (surveys.length === 0) {
                        emptyState.classList.remove('hidden');
                        return;
                    }

                    surveys.forEach(survey => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.style.cursor = 'pointer';
                        card.style.transition = 'transform 0.2s ease, box-shadow 0.2s ease';
                        card.addEventListener('mouseenter', () => { card.style.transform = 'translateY(-4px)'; card.style.boxShadow = '0 12px 24px rgba(0,0,0,0.1)'; });
                        card.addEventListener('mouseleave', () => { card.style.transform = ''; card.style.boxShadow = ''; });
                        card.innerHTML = `
                            <span style="background: linear-gradient(135deg, #818CF8, #4F46E5); color: white; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; display: inline-block;">${survey.category || 'ทั่วไป'}</span>
                            <h3 style="margin-top: 1rem; margin-bottom: 0.5rem;"><a href="survey.html?id=${survey.id}" style="color: inherit; text-decoration: none;">${survey.title}</a></h3>
                            <p style="color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 1rem;">${survey.description || ''}</p>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);">
                                <span style="color: var(--text-secondary); font-size: 0.875rem;"><i class="fas fa-users"></i> ${survey.response_count || 0} ผู้ตอบ</span>
                                <a href="survey.html?id=${survey.id}" class="btn btn-outline" style="padding: 0.5rem 1.25rem; font-size: 0.875rem; border-radius: 12px;">ทำแบบประเมิน <i class="fas fa-arrow-right" style="margin-left:4px;"></i></a>
                            </div>
                        `;
                        surveyGrid.appendChild(card);
                    });
                } catch (err) {
                    console.error(err);
                    loading.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                }
            };
            
            fetchSurveys();
        });
    </script>
</body>
</html>
