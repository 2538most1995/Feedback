<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบประเมินความพึงพอใจ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-body">
    <div class="login-card animate-slide-up">
        <div class="login-logo">
            <i class="fas fa-clipboard-check"></i>
        </div>
        <h1 class="login-title">เข้าสู่ระบบ</h1>
        <p class="login-subtitle">ระบบประเมินความพึงพอใจ (Admin Dashboard)</p>
        
        <div id="loginError" class="login-error">
            ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">ชื่อผู้ใช้งาน</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" class="form-control" placeholder="Username" required>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">รหัสผ่าน</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="Password" required>
                    <button type="button" class="password-toggle" id="togglePassword">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="remember" style="accent-color: var(--primary);">
                <label for="remember" style="font-size: 0.875rem; color: var(--text-light); cursor: pointer;">จดจำฉันไว้ในระบบ</label>
            </div>
            
            <button type="submit" class="login-btn">เข้าสู่ระบบ</button>
        </form>
    </div>

    <script>
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const loginBtn = this.querySelector('button[type="submit"]');
            
            errorDiv.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังเข้าสู่ระบบ...';

            try {
                const res = await fetch('../api/auth.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = 'index.html';
                } else {
                    throw new Error(data.message || 'ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง');
                }
            } catch (err) {
                errorDiv.textContent = err.message || 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
                errorDiv.style.display = 'block';
                const card = document.querySelector('.login-card');
                card.style.animation = 'none';
                card.offsetHeight;
                card.style.animation = 'shake 0.4s ease-in-out';
                loginBtn.disabled = false;
                loginBtn.textContent = 'เข้าสู่ระบบ';
            }
        });
    </script>
</body>
</html>
